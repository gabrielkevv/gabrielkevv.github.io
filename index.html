<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inprogress</title>
<meta name="description" content="Site under maintenance." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0E0F13;
    --ink:#ECEDEF;
    --ink-dim:#9BA0AB;
    --ink-faint:#5C616E;
    --line:#232730;
    --amber:#F2A93B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Mono",monospace;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px;overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:64px 64px;opacity:.25;
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 0%,transparent 70%);
            mask-image:radial-gradient(ellipse at 50% 50%,#000 0%,transparent 70%);
    pointer-events:none;
  }
  .panel{position:relative;z-index:1;text-align:center;max-width:520px}
  .status{
    display:inline-flex;align-items:center;gap:9px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--amber);border:1px solid var(--line);
    padding:8px 14px;margin-bottom:34px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 0 0 rgba(242,169,59,.6);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,169,59,.5)}70%{box-shadow:0 0 0 8px rgba(242,169,59,0)}100%{box-shadow:0 0 0 0 rgba(242,169,59,0)}}
  h1{
    font-family:"Space Grotesk",sans-serif;font-weight:700;
    font-size:clamp(2.2rem,9vw,3.6rem);line-height:1;
    letter-spacing:-.02em;margin-bottom:20px;
  }
  h1 .cursor{color:var(--amber);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  p{color:var(--ink-dim);font-size:14px;line-height:1.7;margin-bottom:8px}
  .meta{margin-top:30px;color:var(--ink-faint);font-size:12px;letter-spacing:.04em}
  .meta a{color:var(--ink-dim);text-decoration:none;border-bottom:1px solid var(--line)}
  .meta a:hover{color:var(--amber);border-color:var(--amber)}
  @media (prefers-reduced-motion:reduce){.dot,.cursor{animation:none}}
</style>
</head>
<body>
  <div class="panel"> 
    <h1>under maintenance<span class="cursor"></span></h1>
  </div>
</body>
</html>
